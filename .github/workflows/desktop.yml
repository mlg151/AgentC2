name: Desktop CI and releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify version and native runner architecture
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          echo "AGENTC2_QA_SCREENSHOT_DIR=$RUNNER_TEMP/agentc2-screenshots" >> "$GITHUB_ENV"
          node scripts/check-version.cjs
          node -e "if(process.arch !== process.env.TARGET_ARCH) throw Error('Native runner architecture mismatch')"
      - name: Linux packaging and display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 xvfb
      - run: npm ci
      - run: npm run test:ci
      - name: Desktop regression checks
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop regression checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Package native application
        shell: bash
        env:
          # Secrets are never exposed to pull requests or ordinary branch builds.
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && (matrix.platform == 'win' && secrets.WIN_CSC_LINK || matrix.platform == 'mac' && secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && (matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/package-native.cjs --"$TARGET_PLATFORM" --"$TARGET_ARCH" --publish never
      - name: Packaged startup and native PTY smoke
        if: runner.os != 'Linux'
        run: npm run test:package
      - name: Packaged startup and native PTY smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AgentC2-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-signing.txt
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Desktop-QA-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/agentc2-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  linux-ssh:
    name: Isolated Linux SSH regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      AGENTC2_HOST: agentc2-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Provision an isolated SSH account on the disposable runner
        run: bash .github/scripts/setup-linux-ssh.sh
      - run: npm ci
      - run: npm run build
      - run: python3 tests/remote-helper.py
      - run: python3 tests/oporders.py
      - run: python3 tests/sitrep.py
      - run: python3 tests/exercises.py
      - run: python3 tests/flash.py
      - run: python3 tests/loop-breaker.py
      - run: python3 tests/worktrees.py
      - run: python3 tests/worktree-diff.py
      - run: python3 tests/provider-telemetry.py
      - run: npx playwright-core install chromium
      - name: Structured chat and managed session regressions
        run: |
          python3 tests/chat-runtime.py
          node tests/chat-ui.e2e.cjs
          node tests/companion-filters.e2e.cjs
          node tests/desktop-sessions.e2e.cjs
          xvfb-run -a node tests/chat-launch.e2e.cjs
          AGENTC2_CHAT_TEST_LOCAL=1 xvfb-run -a node tests/chat-launch.e2e.cjs
        env:
          AGENTC2_QA_SCREENSHOT_DIR: ${{ runner.temp }}/agentc2-chat-screenshots
      - name: Upload structured chat screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Structured-chat-QA-linux
          path: ${{ runner.temp }}/agentc2-chat-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Terminal, workspace, and companion regressions
        run: xvfb-run -a dbus-run-session -- bash .github/scripts/test-linux-ssh.sh

  android:
    name: Android companion
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android unit and device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon testDebugUnitTest connectedDebugAndroidTest coverageReport verifyCoverage assembleDebug
      - name: Load persistent release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentc2-release.jks"
          chmod 600 "$RUNNER_TEMP/agentc2-release.jks"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          AGENTC2_ANDROID_KEYSTORE: ${{ runner.temp }}/agentc2-release.jks
          AGENTC2_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AGENTC2_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AGENTC2_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify and stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          version="${RELEASE_TAG#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "release/AgentC2-$version-android.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/AgentC2-$version-android.apk" > "release/AgentC2-$version-android-signing.txt"
      - name: Upload Android packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AgentC2-android
          if-no-files-found: error
          path: |
            release/*-android.apk
            release/*-android-signing.txt
      - name: Upload development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-development
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-coverage
          if-no-files-found: error
          path: android/app/build/reports/jacoco/coverageReport/coverageReport.xml
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/agentc2-release.jks"

  coverage:
    name: New code 100% line and branch coverage
    needs: [android]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Android-coverage
          path: coverage/android
      - name: Collect source-mapped Node, browser and Android coverage
        env:
          AGENTC2_JACOCO_REPORT: coverage/android/coverageReport.xml
        run: xvfb-run -a npm run coverage:collect
      - name: Enforce coverage gate
        shell: bash
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flags=()
          if [[ "$RELEASE_BUILD" == true ]]; then flags+=(--release); fi
          npm run coverage:check -- "${flags[@]}"
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Changed-code-coverage
          path: coverage/coverage-final.json

  release:
    name: Publish version-tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, linux-ssh, android, coverage]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node scripts/check-version.cjs
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: AgentC2-*
          path: release-assets
          merge-multiple: true
      - name: Publish checked packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/prepare-release.cjs release-assets
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Windows x64, Linux x64, macOS Intel/Apple Silicon packages, and a signed Android companion APK are attached.
          See each *-signing.txt asset for the verified signing/notarization status.
          Installation and unsigned-package limitations: docs/platforms.md in this tag.
          SHA256SUMS.txt covers all attached package and signing files.
          EOF
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "AgentC2 $RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" "${release_flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
