name: Desktop CI and releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      AGENTC2_COVERAGE: '1'
      AGENTC2_SOURCE_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Verify version and native runner architecture
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          echo "AGENTC2_QA_SCREENSHOT_DIR=$RUNNER_TEMP/agentc2-screenshots" >> "$GITHUB_ENV"
          node scripts/check-version.cjs
          node -e "if(process.arch !== process.env.TARGET_ARCH) throw Error('Native runner architecture mismatch')"
      - name: Linux packaging and display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 xvfb
      - run: npm ci
      - name: Install pinned Python coverage (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r tests/requirements.txt
      - name: Install pinned Python coverage (Linux and macOS)
        if: runner.os != 'Windows'
        run: python3 -m pip install -r tests/requirements.txt
      - run: node scripts/coverage.cjs reset
      - run: npm run test:ci
      - name: Desktop regression checks
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop regression checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Native updater download and verification
        if: runner.os != 'Linux'
        run: node scripts/run-tests.cjs updater
      - name: Native updater download and verification (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/run-tests.cjs updater
      - name: Provision Ubuntu WSL1
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-windows-wsl.ps1
      - name: Windows local path startup regressions (requires WSL)
        if: runner.os == 'Windows'
        run: node scripts/run-tests.cjs windows
      - name: Build optimized release renderer
        env:
          AGENTC2_COVERAGE: '0'
        run: npm run build
      - name: Package native application
        shell: bash
        env:
          # Only protected main pushes and release tags receive signing credentials.
          CSC_LINK: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (matrix.platform == 'win' && secrets.WIN_CSC_LINK || matrix.platform == 'mac' && secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/package-native.cjs --"$TARGET_PLATFORM" --"$TARGET_ARCH" --publish never
      - name: Packaged startup and native PTY smoke
        if: runner.os != 'Linux'
        run: npm run test:package
      - name: Packaged startup and native PTY smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Export native coverage with suite evidence
        run: node scripts/coverage.cjs export desktop-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Upload native coverage shard
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Coverage-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/coverage/artifact/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AgentC2-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/*-signing.txt
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Desktop-QA-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/agentc2-screenshots/*.png
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  linux-ssh:
    name: Isolated Linux SSH regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      AGENTC2_HOST: agentc2-ci
      AGENTC2_COVERAGE: '1'
      AGENTC2_SOURCE_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Provision an isolated SSH account on the disposable runner
        run: bash .github/scripts/setup-linux-ssh.sh
      - run: npm ci
      - run: python3 -m pip install -r tests/requirements.txt
      - run: node scripts/coverage.cjs reset
      - run: npm run build
      - run: node scripts/run-tests.cjs linux-python
      - run: npx playwright-core install chromium
      - run: node scripts/run-tests.cjs linux-web
      - run: xvfb-run -a node scripts/run-tests.cjs linux-chat
      - name: Terminal, workspace, SPECOPS, and companion regressions
        run: xvfb-run -a dbus-run-session -- bash .github/scripts/test-linux-ssh.sh
      - name: Export isolated SSH coverage with suite evidence
        run: node scripts/coverage.cjs export linux-ssh
      - name: Upload isolated SSH coverage shard
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Coverage-linux-ssh
          path: test-results/coverage/artifact/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux suite diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Linux-SSH-QA
          path: |
            test-results/
            ${{ runner.temp }}/agentc2-*.log
          if-no-files-found: ignore
          retention-days: 14

  linux-cleanup:
    name: Isolated cleanup regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      AGENTC2_HOST: agentc2-ci
      AGENTC2_CLEANUP_QA_HOME: /tmp/agentc2-cleanup-ssh-ci/remote-home
      AGENTC2_COVERAGE: '1'
      AGENTC2_SOURCE_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: bash .github/scripts/setup-linux-ssh.sh
      - run: npm ci
      - run: python3 -m pip install -r tests/requirements.txt
      - run: node scripts/coverage.cjs reset
      - run: npm run build
      - run: xvfb-run -a node scripts/run-tests.cjs cleanup
      - name: Export isolated cleanup coverage with suite evidence
        run: node scripts/coverage.cjs export linux-cleanup
      - name: Upload isolated cleanup coverage shard
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Coverage-linux-cleanup
          path: test-results/coverage/artifact/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Linux-cleanup-QA
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Production coverage acceptance
    if: always()
    needs: [desktop, linux-ssh, linux-cleanup]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r tests/requirements.txt
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Coverage-*
          path: test-results/coverage-input
          merge-multiple: true
      - name: Require all native shards and acceptance coverage floors
        run: node scripts/coverage.cjs aggregate test-results/coverage-input --acceptance
      - name: Upload combined coverage and provenance
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Complete-coverage-QA
          path: test-results/coverage/
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality gate
    timeout-minutes: 5
    if: always()
    needs: [desktop, linux-ssh, linux-cleanup, coverage]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/quality-gate.cjs
        env:
          QUALITY_GATE_NEEDS: ${{ toJSON(needs) }}

  release:
    name: Publish verified release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality-gate]
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-version.cjs
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: AgentC2-*
          path: release-assets
          merge-multiple: true
      - name: Publish checked packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts
          node scripts/prepare-release.cjs release-assets
          node scripts/publish-release.cjs release-assets
